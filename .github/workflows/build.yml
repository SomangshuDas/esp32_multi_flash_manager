name: Setup & Build Verification

# Runs the same checks and PyInstaller build commands documented in
# docs/BUILD_INSTRUCTIONS.md, on Windows, macOS, and Linux, so a broken
# cross-platform build is caught in CI instead of on someone's machine.
# This is the "does a clean environment even build the app" workflow that
# runs on every push/PR; packaging/*.iss/.spec/.desktop assets used to cut
# an actual installer are exercised separately by release.yml when a
# version tag is pushed (see packaging/README.md).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ESP32MultiFlashManager-windows
            dist_path: dist/ESP32MultiFlashManager.exe
          - os: macos-latest
            artifact_name: ESP32MultiFlashManager-macos
            dist_path: dist/ESP32MultiFlashManager.app
          - os: ubuntu-latest
            artifact_name: ESP32MultiFlashManager-linux
            dist_path: dist/ESP32MultiFlashManager

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux serial/Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Byte-compile the app (fails on syntax errors)
        run: python -m compileall app

      - name: Headless import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import app.main; print('app.main imported OK')"

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name ESP32MultiFlashManager
          --icon resources/icons/app_icon.ico
          --add-data "resources;resources"
          --collect-all esptool
          run.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name ESP32MultiFlashManager
          --add-data "resources:resources"
          --collect-all esptool
          run.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --onefile
          --name ESP32MultiFlashManager
          --add-data "resources:resources"
          --collect-all esptool
          run.py

      - name: Confirm build output exists
        shell: bash
        run: |
          if [ ! -e "${{ matrix.dist_path }}" ]; then
            echo "Expected build output not found at ${{ matrix.dist_path }}"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}
          if-no-files-found: error

      - name: Validate Linux desktop entry / MIME definition
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils shared-mime-info libxml2-utils
          desktop-file-validate packaging/linux/esp32-multi-flash-manager.desktop
          xmllint --noout packaging/linux/esp32-multi-flash-manager-efmproj.xml
          xmllint --noout packaging/linux/esp32-multi-flash-manager.appdata.xml
