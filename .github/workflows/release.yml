name: Release

# Builds the app on Windows, macOS, and Linux and attaches the binaries
# to a GitHub Release whenever a version tag (e.g. v0.1.0) is pushed.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ESP32MultiFlashManager-windows.exe
            dist_path: dist/ESP32MultiFlashManager.exe
          - os: macos-latest
            asset_name: ESP32MultiFlashManager-macos.zip
            dist_path: dist/ESP32MultiFlashManager.app
          - os: ubuntu-latest
            asset_name: ESP32MultiFlashManager-linux
            dist_path: dist/ESP32MultiFlashManager

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux serial/Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name ESP32MultiFlashManager
          --icon resources/icons/app_icon.ico
          --add-data "resources;resources"
          --collect-all esptool
          run.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name ESP32MultiFlashManager
          --add-data "resources:resources"
          --collect-all esptool
          run.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --onefile
          --name ESP32MultiFlashManager
          --add-data "resources:resources"
          --collect-all esptool
          run.py

      - name: Zip macOS .app
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../${{ matrix.asset_name }} ESP32MultiFlashManager.app

      - name: Rename Windows/Linux output to asset name
        if: runner.os != 'macOS'
        shell: bash
        run: cp "${{ matrix.dist_path }}" "${{ matrix.asset_name }}"

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
