# Dependency and Supply-Chain Management: automates dependency-update
# pull requests instead of relying on someone noticing an outdated
# package by hand. Covers both ecosystems the repo actually uses:
#   - pip, for requirements.txt / requirements-dev.txt
#   - github-actions, for the actions pinned in .github/workflows/*.yml
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
