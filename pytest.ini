[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
qt_api = pyside6
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
markers =
    integration: pytest-qt integration tests exercising controllers/widgets together
    e2e: end-to-end tests using a mocked serial/esptool backend, no real hardware
    fuzz: hypothesis-based property/fuzz tests
